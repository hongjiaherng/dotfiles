[Rainmeter]
Update=60000
Background=#CURRENTPATH#BG.png
BackgroundMode=3
BackgroundMargins=12,12,12,12
AccurateText=1
WindowX=20R
WindowY=10

[Variables]
fontName=Segoe UI
textSize=10
DayOffset=0
DateString=
JournalPath=
TodosHeight=200
colorTitle=40,42,55,235
colorText=50,52,65,215
colorDone=170,172,182,200
colorArrow=110,115,135,200
colorArrowHover=40,42,55,255
colorToday=120,135,180,210
colorTodayHover=40,80,180,255
colorSep=0,0,0,22

; ── Measures ─────────────────────────────────────────────────────────────────

[MeasureTodos]
Measure=Script
ScriptFile=#CURRENTPATH#ReadTodos.lua
UpdateDivider=1

; ── Styles ───────────────────────────────────────────────────────────────────

[styleTitle]
StringAlign=Center
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=255,255,255,140
FontColor=#colorTitle#
FontFace=#fontName#
FontSize=12
AntiAlias=1
ClipString=1

[styleText]
StringAlign=Left
StringEffect=Shadow
FontEffectColor=255,255,255,100
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleArrow]
StringAlign=Center
StringStyle=Bold
FontColor=#colorArrow#
FontFace=#fontName#
FontSize=14
AntiAlias=1

; ── Title row: < TODOs > ────────────────────────────────────────────────────

[MeterTitle]
Meter=String
MeterStyle=styleTitle
Text=TODOs
X=140
Y=11
W=100
H=18
LeftMouseUpAction=["obsidian://open?vault=Obsidian%20Vault&file=#JournalPath#"]
DynamicVariables=1

[MeterPrev]
Meter=String
MeterStyle=styleArrow
Text=<
X=20
Y=10
W=18
H=20
LeftMouseUpAction=[!SetVariable DayOffset "(#DayOffset#-1)"][!UpdateMeasure MeasureTodos][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetOption MeterPrev FontColor "#colorArrowHover#"][!UpdateMeter MeterPrev][!Redraw]
MouseLeaveAction=[!SetOption MeterPrev FontColor "#colorArrow#"][!UpdateMeter MeterPrev][!Redraw]
DynamicVariables=1

[MeterNext]
Meter=String
MeterStyle=styleArrow
Text=>
X=260
Y=10
W=18
H=20
LeftMouseUpAction=[!SetVariable DayOffset "(#DayOffset#+1)"][!UpdateMeasure MeasureTodos][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetOption MeterNext FontColor "#colorArrowHover#"][!UpdateMeter MeterNext][!Redraw]
MouseLeaveAction=[!SetOption MeterNext FontColor "#colorArrow#"][!UpdateMeter MeterNext][!Redraw]
DynamicVariables=1

[MeterSepA]
Meter=Image
SolidColor=#colorSep#
X=12
Y=38
W=256
H=1

; ── Date row ─────────────────────────────────────────────────────────────────

[MeterDate]
Meter=String
MeterStyle=styleText
Text=#DateString#
X=12
Y=46
W=200
H=18
DynamicVariables=1

[MeterToday]
Meter=String
MeterStyle=styleText
StringAlign=Right
FontColor=#colorToday#
Text=today
X=268
Y=46
W=60
H=18
LeftMouseUpAction=[!SetVariable DayOffset "0"][!UpdateMeasure MeasureTodos][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetOption MeterToday FontColor "#colorTodayHover#"][!UpdateMeter MeterToday][!Redraw]
MouseLeaveAction=[!SetOption MeterToday FontColor "#colorToday#"][!UpdateMeter MeterToday][!Redraw]
DynamicVariables=1

[MeterSepB]
Meter=Image
SolidColor=#colorSep#
X=12
Y=70
W=256
H=1

; ── Todos list ───────────────────────────────────────────────────────────────

[MeterTodos]
Meter=String
MeasureName=MeasureTodos
MeterStyle=styleText
X=12
Y=80
W=256
H=#TodosHeight#
ClipString=2
InlineSetting=Color | #colorDone#
InlinePattern=\[x\].*
DynamicVariables=1
