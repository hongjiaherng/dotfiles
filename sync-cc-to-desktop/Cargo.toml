[package]
name = "sync-cc-to-desktop"
version = "0.1.0"
edition = "2021"
description = "Make Claude Code CLI sessions appear in the Claude Desktop app's Code sidebar"
license = "MIT"
repository = "https://github.com/hongjiaherng/dotfiles"

[[bin]]
name = "sync-cc-to-desktop"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
